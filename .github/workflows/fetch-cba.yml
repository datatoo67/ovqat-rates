name: Fetch CBA rates

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-cba
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and validate the official bulletin
        run: node scripts/fetch-cba.mjs
      - name: Commit when a newer bulletin was published
        run: |
          if [ -n "$(git status --porcelain cba)" ]; then
            git config user.name "ovqat-rates"
            git config user.email "ovqat-rates@users.noreply.github.com"
            git add cba
            git commit -m "CBA rates $(node -p "require('./cba/meta.json').effectiveDate")"
            git push
          else
            echo "nothing new"
          fi
